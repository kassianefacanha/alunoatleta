services:
  - type: web
    name: aluno-atleta-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run server:build
    startCommand: npm run server:start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TEACHER_EMAIL
        sync: false
      - key: TEACHER_PASSWORD
        sync: false
      - key: TEST_STUDENT_EMAIL
        sync: false
      - key: TEST_STUDENT_PASSWORD
        sync: false
      - key: TERMS_VERSION
        value: 1.0
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: aluno-atleta-uploads
      - key: R2_ENDPOINT
        sync: false
